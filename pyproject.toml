[project]
name = "hat-drivers"
version = "0.10.15"
description = "Hat communication drivers"
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "aiohttp ~=3.14.3",
    "hat-aio ~=0.7.15",
    "hat-asn1 ~=0.7.2",
    "hat-json ~=0.6.9",
    "hat-sbs ~=0.7.7",
    "hat-util ~=0.6.25",
    "pyserial ~=3.5",
]
classifiers = [
    "Programming Language :: Python :: 3"
]

[project.scripts]
hat-iec61850-manager = "hat.drivers.iec61850.manager.main:main"
hat-mqtt-manager = "hat.drivers.mqtt.manager:main"
hat-snmp-manager = "hat.drivers.snmp.manager.cli:main"

[project.urls]
Homepage = "http://hat-open.com"
Repository = "https://github.com/hat-open/hat-drivers.git"
Documentation = "http://hat-drivers.hat-open.com"

[dependency-groups]
run = [
    "aiohttp ~=3.14.3",
    "hat-aio ~=0.7.15",
    "hat-asn1 ~=0.7.2",
    "hat-json ~=0.6.9",
    "hat-sbs ~=0.7.7",
    "hat-util ~=0.6.25",
    "pyserial ~=3.5",
]
build = [
    "hat-asn1 ~=0.7.2",
    "hat-doit ~=0.17.1",
    "hat-json ~=0.6.9",
    "hat-sbs ~=0.7.7",
    "peru >=1.3.5",
]
dev = [
    {include-group = "run"},
    {include-group = "build"},
]

[build-system]
requires = ["hat-doit ~=0.17.1"]
build-backend = "hat.doit.pep517"

[tool.pytest.ini_options]
testpaths = ["test_pytest"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 300

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
include = ["src_py/*"]
data_file = "build/.coverage"
